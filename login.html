<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MATRIX AI - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#050508;height:100vh;overflow:hidden;font-family:'Inter',sans-serif}
#space{position:fixed;inset:0;z-index:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.75) 75%), radial-gradient(ellipse at 30% 20%, rgba(255,120,30,0.15) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(100,80,255,0.12) 0%, transparent 50%)}
.card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;width:90%;max-width:384px;background:rgba(24,24,27,0.88);backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:28px 24px 22px;box-shadow:0 20px 80px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.06)}
.close{position:absolute;top:14px;right:16px;color:#555;font-size:20px;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;transition:0.2s}
.close:hover{background:rgba(255,255,255,0.06);color:#fff}
.logo{width:44px;height:44px;margin:0 auto 14px;background:radial-gradient(circle at 30% 30%, #ffae44, #8a3b00 60%, #000 100%);border-radius:50%;box-shadow:0 0 0 1px rgba(255,170,70,0.3), 0 0 30px rgba(255,120,20,0.4), inset -6px -4px 12px rgba(0,0,0,0.8);position:relative}
.logo::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(255,180,80,0.15)}
h1{font-family:'Space Grotesk';font-size:21px;font-weight:500;color:#fff;text-align:center;letter-spacing:-0.2px}
.sub{font-size:13.5px;color:#8a8a8e;text-align:center;margin-top:10px;line-height:19px;padding:0 8px}
.btn{width:100%;height:50px;border-radius:26px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-size:14.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-top:11px;transition:0.2s;backdrop-filter:blur(8px)}
.btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);transform:translateY(-1px)}
.btn:first-of-type{margin-top:22px}
.divider{display:flex;align-items:center;gap:14px;margin:16px 0 6px}
.divider span{flex:1;height:1px;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent)}
.divider p{font-size:11px;color:#5a5a5e;letter-spacing:2px;font-weight:500}
.input-wrap{position:relative;margin-top:14px}
.input{width:100%;height:50px;border-radius:26px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.4);color:#fff;padding:0 20px 0 44px;font-size:14.5px;outline:none;transition:0.2s}
.input::placeholder{color:#5a5a5e}
.input:focus{border-color:rgba(255,180,80,0.4);background:rgba(0,0,0,0.6);box-shadow:0 0 0 3px rgba(255,140,30,0.12)}
.input-wrap::before{content:'✦';position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#555;font-size:12px}
.continue-white{width:100%;height:50px;border-radius:26px;border:none;background:#fff;color:#000;font-size:14.5px;font-weight:600;cursor:pointer;margin-top:12px;transition:0.2s;box-shadow:0 0 20px rgba(255,255,255,0.15)}
.continue-white:hover{background:#f0f0f0;transform:translateY(-1px);box-shadow:0 4px 24px rgba(255,255,255,0.25)}
.footer{font-size:10px;color:#3a3a3e;text-align:center;margin-top:18px;font-family:monospace;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:4px;height:4px;background:#ff8c1a;border-radius:50%;box-shadow:0 0 6px #ff8c1a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
</style>
</head>
<body>
<div id="space"><canvas id="c"></canvas><div class="vignette"></div></div>

<div class="card">
<div class="close" onclick="history.back()">×</div>
<div class="logo"></div>
<h1>Log in or sign up</h1>
<p class="sub">You'll get smarter responses and can upload files, images, and more.</p>

<button class="btn" onclick="auth('google')">
<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
Continue with Google
</button>

<button class="btn" onclick="auth('apple')">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
Continue with Apple
</button>

<button class="btn" onclick="auth('phone')">
<span style="opacity:0.7">◐</span> Continue with phone
</button>

<div class="divider"><span></span><p>OR</p><span></span></div>

<div class="input-wrap">
<input class="input" id="email" type="email" placeholder="Email address — voyager@matrix.ai" />
</div>

<button class="continue-white" onclick="go()">Continue →</button>

<div class="footer"><div class="dot"></div> MATRIX AI • ORBITAL STATION • SECURE LINK</div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2, 9);
camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

// Stars background
const sGeo=new THREE.BufferGeometry(); const sPos=[];
for(let i=0;i<7000;i++) sPos.push((Math.random()-0.5)*180,(Math.random()-0.5)*180,(Math.random()-0.5)*180);
sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos,3));
scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({size:0.18,color:0xffffff,transparent:true,opacity:0.75})));

// LIGHT
const ambient=new THREE.AmbientLight(0xffffff,0.4);
scene.add(ambient);
const sunLight=new THREE.PointLight(0xffcc66, 3, 50);
sunLight.position.set(0,0,0);
scene.add(sunLight);

// SUN - bright center
const sunMat=new THREE.MeshBasicMaterial({color:0xffb347});
const sun=new THREE.Mesh(new THREE.SphereGeometry(1.1,64,64), sunMat);
const sunGlow=new THREE.Mesh(new THREE.SphereGeometry(1.7,32,32), new THREE.MeshBasicMaterial({color:0xff8800, transparent:true, opacity:0.18}));
scene.add(sun, sunGlow);

// PLANETS - Made bigger and closer so visible behind card
const planets=[
  {d:2.2, size:0.18, color:0x9e9e9e, speed:1.6},
  {d:3.0, size:0.32, color:0xe6cdac, speed:1.2},
  {d:4.0, size:0.34, color:0x4b8ad6, speed:0.95, moon:true},
  {d:5.2, size:0.28, color:0xd14a2a, speed:0.75},
  {d:6.8, size:0.75, color:0xe3dcc0, speed:0.45, ring:false},
  {d:8.6, size:0.65, color:0xf7e57a, speed:0.35, ring:true},
  {d:10.2, size:0.5, color:0x5fb0e6, speed:0.28},
  {d:11.8, size:0.48, color:0x3a6bff, speed:0.22},
];

const meshes=[];
planets.forEach((p,i)=>{
  // orbit line - more visible
  const pts=[]; for(let j=0;j<=64;j++){ const a=j/64*Math.PI*2; pts.push(Math.cos(a)*p.d,0,Math.sin(a)*p.d); }
  const oGeo=new THREE.BufferGeometry(); oGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts.flat(),3));
  const line=new THREE.Line(oGeo, new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.12}));
  scene.add(line);

  const mat=new THREE.MeshStandardMaterial({color:p.color, roughness:0.7, metalness:0.1, emissive:p.color, emissiveIntensity:0.08});
  const m=new THREE.Mesh(new THREE.SphereGeometry(p.size,32,32), mat);
  m.userData={...p, ang: (i/planets.length)*Math.PI*2 + Math.random()};
  meshes.push(m); scene.add(m);
  if(p.ring){
    const ring=new THREE.Mesh(new THREE.RingGeometry(p.size*1.3, p.size*2.0, 32), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.35, side:THREE.DoubleSide}));
    ring.rotation.x=Math.PI/2.3; m.add(ring);
  }
  if(p.moon){
    const moon=new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16), new THREE.MeshStandardMaterial({color:0xcccccc}));
    moon.position.set(0.55,0,0); m.add(moon);
  }
});

let t=0;
function loop(){
  requestAnimationFrame(loop); t+=0.01;
  sun.rotation.y+=0.003; sunGlow.scale.setScalar(1+Math.sin(t*2)*0.06);
  meshes.forEach(m=>{
    m.userData.ang+=0.008*m.userData.speed;
    m.position.x=Math.cos(m.userData.ang)*m.userData.d;
    m.position.z=Math.sin(m.userData.ang)*m.userData.d;
    m.position.y=Math.sin(m.userData.ang*0.5)*0.15;
    m.rotation.y+=0.015;
  });
  // slow camera rotation for more visible movement
  camera.position.x=Math.sin(t*0.15)*1.5;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
loop();
onresize=()=>{renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix()}
</script>

</html>
